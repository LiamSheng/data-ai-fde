# Scope evaluation cases for the router (Clef `choice` question).
#
# [2026-11-26] Rule (user decision): judge the user's *intent*. In scope when the
# intent is Metro Vancouver (TransLink service area) public transit information
# or travel, or weather's effect on that travel; greetings and questions about
# the assistant are in scope too. Out of scope: weather with no travel intent,
# transit outside the service area, tasks that only use transit as a theme
# (jokes, translation, code, job applications, stories), and unrelated or
# role-changing requests.
#
# in_scope means "hand to the assistant", not "the data can answer it": the agent
# loop ends honestly when it cannot (that is an agent eval, not a router eval).
#
# Fields: expected (in_scope | out_of_scope) and option (the choice criterion the
# case should select). in_scope options: transit, weather_transit, smalltalk.
#
# Sources: 48 cases from archive/agent-v1 (labels unchanged: they already encode
# this rule; v1 tuned kNN on them, so they are development data for kNN, not for
# Clef) and 14 new cases covering cancellations, detours, stops and weather edges.
# Run the router on all of them once, unchanged, as the baseline; after the
# question wording is tuned on its errors, this file is development data too.

