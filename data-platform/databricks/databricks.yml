bundle:
  name: transit_realtime_pipeline
  deployment:
    lock:
      enabled: true

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  schema_prefix:
    default: transit_dev
  warehouse_id:
    description: Existing SQL warehouse; deployment does not create or resize it.
    default: 7c54787fedb2e2ac
  landing_root:
    description: Landing prefix the Auto Loader job reads; a /Volumes/ copy for acceptance.
    default: gs://transit-realtime-landing-26/
  max_files_per_trigger:
    description: Audits per Auto Loader micro-batch; bounds payload bytes held on the driver.
    default: "50"
  discover_from_utc:
    description: >-
      Where a new Auto Loader checkpoint starts discovering Landing audits: `all`
      (full backfill) or a UTC time like 2026-11-25T00:00:00Z. Read only when the
      checkpoint is created; also each feed's Bronze coverage start (KAN-37).
  coverage_settle_minutes:
    description: >-
      Health check coverage skips Landing audits modified this recently: the
      collector may have written them after this run's discovery.
    default: "15"
  max_capture_age_minutes:
    description: Health check fails when a realtime feed's latest successful capture in Bronze is older.
    default: "60"
  reference_static_sha256:
    description: Static version the Vehicle Positions slice joins; dim_routes uses the latest instead.
    default: ac5f83a35d4c79063f44cb9962d8fbdeb283788d0ff87d86c4ccf13cee22d3bc

workspace:
  host: https://8259562609571268.8.gcp.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - check_local.py
    - ingestion/tests/**
    - genie/**
    - dbt/.venv/**
    - dbt/dev/**
    - dbt/target/**
    - dbt/logs/**
    - dbt/dbt_packages/**

targets:
  dev:
    default: true
    mode: development
  # Deploy main here (-t main) while the showcase branch owns the dev deployment:
  # each target has its own root path and state, so deploying main to dev would
  # delete the showcase Job, which main does not define.
  main:
    mode: development
    variables:
      # KAN-37 cutover without backfill: Bronze coverage starts here for this target.
      discover_from_utc: "2026-11-25T05:00:00Z"
