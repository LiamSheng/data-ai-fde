version: 2
sources:
  - name: bronze
    description: Immutable content records and independent capture attempts loaded by Python/Spark.
    database: "{{ var('bronze_catalog') }}"
    schema: "{{ var('bronze_schema') }}"
    tables:
      # Written only by the Auto Loader job (KAN-35). Enabled once the slice Job reads
      # through it (KAN-37); until then their source tests would fail `dbt build`.
      - name: service_alerts
        config:
          enabled: "{{ var('autoloader_bronze') | as_bool }}"
        description: >-
          One source entity per immutable Service Alerts payload, in source order.
          Non-alert entities have NULL informed_entity and active_period; present
          alerts keep empty lists. Optional values remain NULL, including absent enum
          fields. Missing period bounds mean an unbounded start or end. Text selects
          en, otherwise a sole translation, otherwise NULL. Images remain in
          raw_entity_json.
        data_tests:
          - unique_key:
              arguments:
                columns: [payload_sha256, entity_index]
        columns:
          - name: payload_sha256
            data_tests: [not_null]
          - name: entity_index
            data_tests: [not_null]
          - name: has_alert
            data_tests: [not_null]
          - name: informed_entity
            description: Ordered selectors with nullable fields and a nullable nested TripDescriptor.
          - name: active_period
            description: Ordered UTC periods; NULL start/end represents an unbounded interval.
          - name: raw_entity_json
            data_tests: [not_null]
          - name: record_sha256
            data_tests: [not_null]
      - name: quarantine
        config:
          enabled: "{{ var('autoloader_bronze') | as_bool }}"
        description: >-
          Append-only events for audit files that broke the source contract: one
          'quarantined' event per distinct failed check, and a 'resolved' event once a
          replay converts the file. Unresolved files are not in capture_attempts.
        data_tests:
          - unique_key:
              arguments:
                columns: [audit_ref, audit_sha256, event, failed_check]
        columns:
          - name: audit_ref
            data_tests: [not_null]
          - name: event
            data_tests:
              - accepted_values:
                  arguments:
                    values: [quarantined, resolved]
      - name: capture_attempts
        description: One row per audit attempt; repeated content hashes remain distinct observations.
        columns:
          - name: attempt_id
            data_tests: [not_null, unique]
          - name: audit_ref
            data_tests: [not_null, unique]
          - name: record_sha256
            data_tests: [not_null]
      - name: vehicle_positions
        description: One entity per immutable RT payload; preserves missing values and raw entity JSON.
        data_tests:
          - unique_key:
              arguments:
                columns: [payload_sha256, entity_index]
        columns:
          - name: payload_sha256
            data_tests: [not_null]
          - name: entity_index
            data_tests: [not_null]
          - name: raw_entity_json
            data_tests: [not_null]
      - name: trip_updates
        description: >-
          One row per stop time update per immutable Trip Updates payload, with trip-level
          fields repeated; a trip without stop updates keeps one row with a null update_index.
        data_tests:
          - unique_key:
              arguments:
                columns: [payload_sha256, entity_index, update_index]
        columns:
          - name: payload_sha256
            data_tests: [not_null]
          - name: entity_index
            data_tests: [not_null]
          - name: has_trip_update
            data_tests: [not_null]
          - name: raw_trip_json
            data_tests: [not_null]
      - name: routes
        description: One route per Static ZIP content version, independent of capture frequency.
        data_tests:
          - unique_key:
              arguments:
                columns: [static_payload_sha256, route_id]
        columns:
          - name: static_payload_sha256
            data_tests: [not_null]
          - name: route_id
            data_tests: [not_null]
      - name: calendar
        description: One calendar.txt service per Static ZIP content version; day flags and dates as published.
        data_tests:
          - unique_key:
              arguments:
                columns: [static_payload_sha256, service_id]
        columns:
          - name: static_payload_sha256
            data_tests: [not_null]
          - name: service_id
            data_tests: [not_null]
      - name: calendar_dates
        description: One calendar_dates.txt exception per Static ZIP content version, service and date.
        data_tests:
          - unique_key:
              arguments:
                columns: [static_payload_sha256, service_id, date]
        columns:
          - name: static_payload_sha256
            data_tests: [not_null]
          - name: service_id
            data_tests: [not_null]
          - name: date
            data_tests: [not_null]
