  - name: day_type_overrides_come_from_the_latest_static_calendar
    # Single Day type services run only Monday-Friday, only Saturday or only Sunday.
    # A date takes the Day type of the single Day type services running on it, when
    # they agree and differ from its day of the week.
    model: service_date_overrides
    given:
      - input: ref('int_latest_static_version')
        rows:
          - {payload_sha256: latest}
      - input: ref('stg_calendar')
        rows:
          - {static_payload_sha256: latest, service_id: WEEKDAY, monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: false, sunday: false, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: latest, service_id: SATURDAY, monday: false, tuesday: false, wednesday: false, thursday: false, friday: false, saturday: true, sunday: false, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: latest, service_id: SUNDAY, monday: false, tuesday: false, wednesday: false, thursday: false, friday: false, saturday: false, sunday: true, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: latest, service_id: EVERY_DAY, monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: true, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: latest, service_id: SPECIAL, monday: false, tuesday: false, wednesday: false, thursday: false, friday: false, saturday: false, sunday: false, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: older, service_id: WEEKDAY, monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: false, sunday: false, start_date: '2026-09-07', end_date: '2027-01-03'}
          - {static_payload_sha256: older, service_id: SUNDAY, monday: false, tuesday: false, wednesday: false, thursday: false, friday: false, saturday: false, sunday: true, start_date: '2026-09-07', end_date: '2027-01-03'}
      - input: ref('stg_calendar_dates')
        rows:
          # Thanksgiving Monday: weekday service removed, Sunday service added.
          - {static_payload_sha256: latest, service_id: WEEKDAY, service_date: '2026-10-12', exception_type: 2}
          - {static_payload_sha256: latest, service_id: SUNDAY, service_date: '2026-10-12', exception_type: 1}
          # A Monday running Saturday service.
          - {static_payload_sha256: latest, service_id: WEEKDAY, service_date: '2026-12-28', exception_type: 2}
          - {static_payload_sha256: latest, service_id: SATURDAY, service_date: '2026-12-28', exception_type: 1}
          # Removal alone leaves no single Day type service running.
          - {static_payload_sha256: latest, service_id: WEEKDAY, service_date: '2026-10-13', exception_type: 2}
          # Weekday and Sunday service both running: no single Day type.
          - {static_payload_sha256: latest, service_id: SUNDAY, service_date: '2026-10-14', exception_type: 1}
          # Adding a special or every-day service changes nothing.
          - {static_payload_sha256: latest, service_id: SPECIAL, service_date: '2026-10-15', exception_type: 1}
          - {static_payload_sha256: latest, service_id: EVERY_DAY, service_date: '2026-10-15', exception_type: 1}
          # A Saturday adding Saturday service matches its day of the week.
          - {static_payload_sha256: latest, service_id: SATURDAY, service_date: '2026-12-26', exception_type: 1}
          # Only the latest version counts.
          - {static_payload_sha256: older, service_id: WEEKDAY, service_date: '2026-10-16', exception_type: 2}
          - {static_payload_sha256: older, service_id: SUNDAY, service_date: '2026-10-16', exception_type: 1}
    expect:
      rows:
        - {service_date: '2026-10-12', day_type: sunday}
        - {service_date: '2026-12-28', day_type: saturday}
