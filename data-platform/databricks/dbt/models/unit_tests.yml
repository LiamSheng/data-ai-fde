  - name: latest_static_version_is_the_latest_successful_loaded_capture
    model: int_latest_static_version
    given:
      - input: ref('stg_routes')
        rows:
          - {static_payload_sha256: older, route_id: '6641'}
          - {static_payload_sha256: newer, route_id: '6641'}
          - {static_payload_sha256: newer, route_id: '6612'}
      - input: ref('stg_capture_attempts')
        rows:
          - {attempt_id: first, feed_type: gtfs_schedule, is_success: true, payload_sha256: older, completed_at_utc: '2026-10-01 12:00:00'}
          - {attempt_id: second, feed_type: gtfs_schedule, is_success: true, payload_sha256: newer, completed_at_utc: '2026-10-08 12:00:00'}
          # A later failed attempt and a later realtime capture do not choose a version.
          - {attempt_id: failed, feed_type: gtfs_schedule, is_success: false, payload_sha256: older, completed_at_utc: '2026-10-10 12:00:00'}
          - {attempt_id: realtime, feed_type: trip_updates, is_success: true, payload_sha256: older, completed_at_utc: '2026-10-11 12:00:00'}
          # Captured but whose routes are not in Bronze yet: only loaded versions count.
          - {attempt_id: unloaded, feed_type: gtfs_schedule, is_success: true, payload_sha256: not_loaded, completed_at_utc: '2026-10-12 12:00:00'}
    expect:
      rows:
        - {payload_sha256: newer}
